name = "woozoo-risk-ledger-builder"
description = "Builds deterministic Woozoo risk, paper-order state, multi-commodity double-entry ledger, idempotency, and reconciliation within the approved product Phase."
nickname_candidates = ["Aegis", "Ledger"]
sandbox_mode = "workspace-write"
