[project]
name = "woozoo-platform"
version = "0.1.0"
description = "Woozoo Phase 1 platform foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "websockets>=15,<16",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["packages/python/platform-core/src", "services/control-api/src", "services/market-data-worker/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages/python/platform-core/src", "services/control-api/src", "services/outbox-relay/src", "services/market-data-worker/src"]
